<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LM Studio Chat</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>LM Studio</h1>
      </div>
      <button class="new-chat-btn" id="newChat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        New Chat
      </button>
      <div class="chat-history" id="chatHistory"></div>
    </aside>
    
    <main class="chat-container">
      <div class="chat-header">
        <div class="model-info">
          <span class="model-dot"></span>
          <span id="modelName">Loading model...</span>
        </div>
      </div>
      
      <div class="messages" id="messages"></div>
      
      <div class="typing-indicator" id="typingIndicator">
        <span></span><span></span><span></span>
      </div>
      
      <div class="input-area">
        <div class="input-container">
          <textarea 
            id="userInput" 
            placeholder="Send a message..." 
            rows="1"
          ></textarea>
          <div class="input-buttons">
            <button id="stopBtn" class="stop-btn" style="display:none;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="6" y="6" width="12" height="12"></rect>
              </svg>
            </button>
            <button id="sendBtn" class="send-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
        <p class="disclaimer">AI can make mistakes. Consider verifying important information.</p>
      </div>
    </main>

    <aside class="tools-sidebar">
      <div class="sidebar-header">
        <h1>Tools</h1>
      </div>
      <div class="tools-list" id="toolsList"></div>
    </aside>
  </div>

  <div id="confirm-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-icon">⚠️</span>
        <h3>Confirm Tool Execution</h3>
      </div>
      <div class="modal-body">
        <p><strong>Tool:</strong> <span id="confirm-tool-name"></span></p>
        <p><strong>Action:</strong> <span id="confirm-tool-action"></span></p>
        <div class="confirm-params">
          <pre id="confirm-tool-params"></pre>
        </div>
      </div>
      <div class="modal-buttons">
        <button id="confirm-deny" class="modal-btn deny">✕ Cancel</button>
        <button id="confirm-allow" class="modal-btn allow">✓ Confirm</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
